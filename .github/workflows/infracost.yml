name: "Infracost Cloud Spend Delta Gate"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"

jobs:
  infracost_diff:
    name: "Infracost IaC Spend Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Infracost"
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: "Generate Infracost Cost Diff"
        run: |
          infracost breakdown --path=terraform/ --format=json --out-file=/tmp/infracost.json || true
          infracost diff --path=terraform/ --format=json --out-file=/tmp/infracost-diff.json || true
