name: "Edge Telemetry CI/CD & Quality Gate"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_and_test_matrix:
    name: "Python Matrix & Quality Gate"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pydantic

      - name: "Execute Ruff Linter"
        run: |
          ruff check src/ tests/ --exit-zero

      - name: "Execute Unit & Integration Tests"
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest tests/ -v

  security_and_iac_scan:
    name: "Trivy Security & Vulnerability Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Trivy File System & IaC Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  ansible_quality_gate:
    name: "Ansible Edge Provisioning Quality Gate"
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: "ansible.cfg"
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install Ansible Core & Collections"
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: "Validate Playbook Syntax"
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/provision-edge-gateways.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/verify-edge-health.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/site.yml --syntax-check

      - name: "Run Ansible Lint"
        run: |
          ansible-lint ansible/playbooks/*.yml --nocolor || true

